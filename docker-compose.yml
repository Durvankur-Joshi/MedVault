version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medvault-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medvault
      POSTGRES_USER: medvault_user
      POSTGRES_PASSWORD: medvault_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvault_user -d medvault"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
